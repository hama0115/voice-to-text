<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="耳の聞こえにくい方とのコミュニケーションを助ける音声認識アプリです。マイクに話しかけると、内容を大きな文字で表示します。"
    />
    <meta name="theme-color" content="#f0f0f0" />
    <title>じいちゃん用 筆談アプリ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="controls">
      <p id="mic-status">
        マイクがOFFになっています。下のボタンを押してONにしてください。
      </p>
      <button id="start-btn" type="button">
        マイクをONにする（このあと止められません）
      </button>
    </div>
    <div id="result">話しかけた内容がここに表示されます。</div>

    <script src="app.js" defer></script>
  </body>
</html>
